<svg xmlns="http://www.w3.org/2000/svg" width="830" height="160" viewBox="0 0 830 160" role="img" aria-label="The Word"><style>
  .t { font: 700 15px Georgia, 'Times New Roman', serif; fill: #a31515; letter-spacing: 4px; }
  .l { font: 400 15px Georgia, 'Times New Roman', serif; fill: #e8e2d6; }
  .n { font: 700 15px 'Courier New', monospace; fill: #e8e2d6; }
  .s { font: 400 11px 'Courier New', monospace; fill: #8a8378; letter-spacing: 2px; }
  .big { font: 700 20px Georgia, 'Times New Roman', serif; fill: #e8e2d6; }
  .don { fill: #a31515; }
  .q { font: italic 400 19px Georgia, 'Times New Roman', serif; fill: #e8e2d6; }
  .in { opacity: 0; animation: in 0.6s ease-out forwards; }
  .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1s ease-out forwards; }
  .rule { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.2s ease-out forwards; }
  @keyframes in { to { opacity: 1; } }
  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .cur { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
</style><rect x="0.5" y="0.5" width="829" height="159" rx="3" fill="#0b0b0b" stroke="#2a2a2a"/><text x="25" y="38" class="t">THE WORD</text><line x1="25" y1="50" x2="805" y2="50" stroke="#a31515" stroke-width="1" class="rule"/><text x="415" y="88" text-anchor="middle" class="q in" style="animation-delay:0.30s"><tspan x="415" dy="0">“Keep your friends close, but your enemies closer.”</tspan></text><text x="415" y="128" text-anchor="middle" class="s in" style="animation-delay:1.05s">THE GODFATHER PART II</text></svg>